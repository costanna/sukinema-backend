# Perfil de produccion (Render + Neon). Lo activa el Dockerfile con SPRING_PROFILES_ACTIVE=prod.
# Exige DATABASE_URL: sin ella el arranque falla en vez de usar H2 en memoria sin avisar.

spring.h2.console.enabled=false

# Pool pequeno: el plan gratuito de Neon limita conexiones y Render da 512 MB.
# minimum-idle=0 deja que el pool se vacie para que Neon pueda suspender el computo cuando no hay uso.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
