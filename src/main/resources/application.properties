# En local escucha en 8088; en Render el puerto llega en la variable PORT
server.port=${PORT:8088}

# Base de datos por defecto: H2 en memoria (desarrollo local).
# Si existe la variable DATABASE_URL (Neon) se usa PostgreSQL en su lugar:
# ver DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=jdbc:h2:mem:sukinemadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (se desactiva en el perfil prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Las consultas terminan dentro de cada servicio: la conexión no queda ocupada mientras se escribe la respuesta
spring.jpa.open-in-view=false

# Mensajes de la API: en el idioma de la cabecera Accept-Language (ca, en, es); castellano si no se pide ninguno
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=es
spring.web.locale-resolver=accept-header

# CORS: origenes permitidos separados por comas; admite comodines (https://*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Sesiones: clave de firma de los tokens. Si se deja vacia se genera una y se guarda en la base de datos.
app.jwt.secret=${JWT_SECRET:}
# Correo de la cuenta administradora. Si se deja vacio, administra la primera cuenta que se registre.
app.admin-email=${ADMIN_EMAIL:}

logging.level.com.sukinema=INFO
