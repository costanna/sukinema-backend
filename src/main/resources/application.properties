# En local escucha en 8088; en Render el puerto llega en la variable PORT
server.port=${PORT:8088}

# Base de datos por defecto: H2 en memoria (desarrollo local).
# Si existe la variable DATABASE_URL (Neon) se usa PostgreSQL en su lugar:
# ver DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=jdbc:h2:mem:sukinemadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (se desactiva en el perfil prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS: origenes permitidos separados por comas; admite comodines (https://*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.sukinema=INFO
