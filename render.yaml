# Blueprint de Render: crea el servicio web del backend a partir del Dockerfile de este repositorio.
# Render pedirá el valor de las variables marcadas con sync: false al crear el Blueprint.
services:
  - type: web
    name: sukinema-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Cadena de conexión de Neon, tal cual la da su panel (postgresql://...)
      - key: DATABASE_URL
        sync: false
      # URL del frontend en Vercel, p. ej. https://sukinema.vercel.app (varias separadas por comas)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Keep-awake estilo woke-dyno: un hilo pide la URL pública cada N ms
      # para que el plan gratuito no se duerma (~15 min sin tráfico). Solo
      # la URL es secreta de este despliegue: se rellena a mano.
      - key: KEEP_AWAKE_ENABLED
        value: "false"
      - key: KEEP_AWAKE_URL
        sync: false
      - key: KEEP_AWAKE_INTERVAL_MS
        value: "600000"
